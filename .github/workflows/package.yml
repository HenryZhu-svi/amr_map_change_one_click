name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ubuntu-deb:
    name: Ubuntu 22.04 ${{ matrix.arch }} DEB
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            artifact: ubuntu-22.04-amd64-deb
          - runner: ubuntu-22.04-arm
            arch: arm64
            artifact: ubuntu-22.04-arm64-deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            dpkg-dev \
            qt6-base-dev \
            libgl1-mesa-dev \
            libglx-dev \
            libopengl-dev
      - name: Build DEB
        run: bash scripts/package-ubuntu.sh
      - name: Verify package architecture
        run: |
          package="$(find dist/ubuntu -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          actual_arch="$(dpkg-deb -f "$package" Architecture)"
          test "$actual_arch" = "${{ matrix.arch }}"
          echo "Verified package architecture: $actual_arch"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/ubuntu/*.deb
            dist/ubuntu/SHA256SUMS.txt
          if-no-files-found: error

  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Locate Visual C++ Redistributable
        id: vcredist
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $redist = Get-ChildItem "$vsRoot\VC\Redist\MSVC" -Recurse -Filter vc_redist.x64.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $redist) { throw "Visual C++ Redistributable not found" }
          "path=$($redist.FullName)" >> $env:GITHUB_OUTPUT
      - name: Build installer and portable package
        shell: powershell
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "0.3.0"
          }
          .\scripts\package-windows.ps1 `
            -QtRoot "$env:QT_ROOT_DIR" `
            -VCRedistPath "${{ steps.vcredist.outputs.path }}" `
            -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: |
            dist/windows/*-setup.exe
            dist/windows/*-portable.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - ubuntu-deb
      - windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          find release-artifacts -type f \( \
            -name '*.deb' -o \
            -name '*-setup.exe' -o \
            -name '*-portable.zip' \
          \) -exec cp '{}' release-files/ \;

          while IFS= read -r checksum; do
            artifact_name="$(basename "$(dirname "$checksum")")"
            cp "$checksum" "release-files/SHA256SUMS-${artifact_name}.txt"
          done < <(find release-artifacts -type f -name 'SHA256SUMS.txt' | sort)

          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"
          ls -lh release-files

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/* \
              --verify-tag \
              --generate-notes \
              --title "AMR Map Manager $GITHUB_REF_NAME"
          fi
