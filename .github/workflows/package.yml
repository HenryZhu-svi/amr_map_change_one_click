name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ubuntu-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev dpkg-dev
      - name: Build DEB
        run: bash scripts/package-ubuntu.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-22.04-deb
          path: |
            dist/ubuntu/*.deb
            dist/ubuntu/SHA256SUMS.txt
          if-no-files-found: error

  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Locate Visual C++ Redistributable
        id: vcredist
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $redist = Get-ChildItem "$vsRoot\VC\Redist\MSVC" -Recurse -Filter vc_redist.x64.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $redist) { throw "Visual C++ Redistributable not found" }
          "path=$($redist.FullName)" >> $env:GITHUB_OUTPUT
      - name: Build installer and portable package
        shell: powershell
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "0.2.0"
          }
          .\scripts\package-windows.ps1 `
            -QtRoot "$env:QT_ROOT_DIR" `
            -VCRedistPath "${{ steps.vcredist.outputs.path }}" `
            -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: |
            dist/windows/*-setup.exe
            dist/windows/*-portable.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
